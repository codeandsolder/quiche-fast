name: Strict Rust

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@7d0552029497cf094787c3593f804d5bce137c4b # main
    with:
      # The smaller packages already enforce all-target strict policy.
      # The quiche package enforces all targets in its own feature matrix.
      # #52/#55 track the remaining workspace packages.
      cargo-args: "--all-targets --no-deps -p buffer-pool -p datagram-socket -p netlog -p octets -p qlog -p task-killswitch --features qlog/nightly-clippy-expects,buffer-pool/nightly-clippy-expects,netlog/nightly-clippy-expects"
      apt-packages: "libexpat1-dev libfreetype6-dev libfontconfig1-dev"
      ban-python-outside-ci: true


  strict-qlog-compressed:
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: gzip
            features: gzip,nightly-clippy-expects
          - configuration: zstd
            features: zstd,nightly-clippy-expects
          - configuration: combined
            features: gzip,zstd,foundations,nightly-clippy-expects
    name: "qlog (${{ matrix.configuration }})"
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@7d0552029497cf094787c3593f804d5bce137c4b # main
    with:
      cargo-args: "--locked --no-deps -p qlog --all-targets --features ${{ matrix.features }}"
      apt-packages: "libexpat1-dev libfreetype6-dev libfontconfig1-dev"
      ban-python-outside-ci: true


  strict-quiche-core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: default
            cargo-args: "--locked --no-deps -p quiche --all-targets"
          - configuration: expanded
            cargo-args: "--locked --no-deps -p quiche --all-targets --features ffi,qlog,internal,custom-client-dcid,gcongestion"
    name: "quiche core (${{ matrix.configuration }})"
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@7d0552029497cf094787c3593f804d5bce137c4b # main
    with:
      cargo-args: ${{ matrix['cargo-args'] }}
      apt-packages: "libexpat1-dev libfreetype6-dev libfontconfig1-dev"
      ban-python-outside-ci: true


  strict-quiche-apps:
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: default
            cargo-args: "--locked --no-deps -p quiche_apps --all-targets"
          - configuration: minimal
            cargo-args: "--locked --no-deps -p quiche_apps --all-targets --no-default-features"
    name: "quiche apps (${{ matrix.configuration }})"
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@7d0552029497cf094787c3593f804d5bce137c4b # main
    with:
      cargo-args: ${{ matrix['cargo-args'] }}
      apt-packages: "libexpat1-dev libfreetype6-dev libfontconfig1-dev"
      ban-python-outside-ci: true


  strict-h3i:
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: default
            cargo-args: "--locked --no-deps -p h3i --all-targets"
          - configuration: async
            cargo-args: "--locked --no-deps -p h3i --all-targets --features async"
    name: "h3i (${{ matrix.configuration }})"
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@7d0552029497cf094787c3593f804d5bce137c4b # main
    with:
      cargo-args: ${{ matrix['cargo-args'] }}
      apt-packages: "libexpat1-dev libfreetype6-dev libfontconfig1-dev"
      ban-python-outside-ci: true


  strict-qlog-dancer-wasm:
    name: "qlog-dancer (wasm32)"
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@7d0552029497cf094787c3593f804d5bce137c4b # main
    with:
      cargo-args: "--locked --no-deps -p qlog-dancer --lib --target wasm32-unknown-unknown"
      rust-targets: "wasm32-unknown-unknown"
      ban-python-outside-ci: true


  strict-qlog-dancer-native:
    name: "qlog-dancer (native)"
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@7d0552029497cf094787c3593f804d5bce137c4b # main
    with:
      cargo-args: "--locked --no-deps -p qlog-dancer --all-targets"
      apt-packages: "libexpat1-dev libfreetype6-dev libfontconfig1-dev"
      ban-python-outside-ci: true
