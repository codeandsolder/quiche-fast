name: Strict Rust

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@main
    with:
      # Keep the strict rollout aligned with Stable CI. qlog-dancer is an
      # existing legacy exclusion tracked for separate hardening in #52.
      cargo-args: "--workspace --all-targets --exclude qlog-dancer"
      apt-packages: "libexpat1-dev libfreetype6-dev libfontconfig1-dev"
