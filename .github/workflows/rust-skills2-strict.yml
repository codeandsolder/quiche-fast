name: Strict Rust

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@5991b873ab28ec8fae36c2c8ef944a3f67f5f9b3 # main
    with:
      command: ":"
      rustflags: ""
      rust-targets: wasm32-unknown-unknown
      apt-packages: libexpat1-dev libfreetype6-dev libfontconfig1-dev
      timeout-minutes: 120
      strict-suites: |
        [
          {"name":"support","cargo":["--locked","--all-targets","--no-deps","-p","datagram-socket","-p","netlog","-p","octets","-p","qlog","-p","task-killswitch","-p","tokio-quiche","--features","qlog/nightly-clippy-expects,netlog/nightly-clippy-expects,tokio-quiche/rpk"]},
          {"name":"qlog-gzip","cargo":["--locked","--no-deps","-p","qlog","--all-targets","--features","gzip,nightly-clippy-expects"]},
          {"name":"qlog-zstd","cargo":["--locked","--no-deps","-p","qlog","--all-targets","--features","zstd,nightly-clippy-expects"]},
          {"name":"qlog-combined","cargo":["--locked","--no-deps","-p","qlog","--all-targets","--features","gzip,zstd,nightly-clippy-expects"]},
          {"name":"core-default","cargo":["--locked","--no-deps","-p","quiche","--all-targets"]},
          {"name":"core-expanded","cargo":["--locked","--no-deps","-p","quiche","--all-targets","--features","ffi,qlog,internal,custom-client-dcid,gcongestion"]},
          {"name":"apps-default","cargo":["--locked","--no-deps","-p","quiche_apps","--all-targets"]},
          {"name":"apps-minimal","cargo":["--locked","--no-deps","-p","quiche_apps","--all-targets","--no-default-features"]},
          {"name":"h3i-default","cargo":["--locked","--no-deps","-p","h3i","--all-targets"]},
          {"name":"h3i-async","cargo":["--locked","--no-deps","-p","h3i","--all-targets","--features","async"]},
          {"name":"dancer-native","cargo":["--locked","--no-deps","-p","qlog-dancer","--all-targets"]},
          {"name":"dancer-wasm","cargo":["--locked","--no-deps","-p","qlog-dancer","--lib","--target","wasm32-unknown-unknown"]}
        ]
