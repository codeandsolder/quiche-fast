name: Strict Rust

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@main
    with:
      # Keep strict Clippy on the cleaned workspace while tracked legacy
      # debt islands migrate separately: qlog-dancer #52, quiche core #54.
      # Source-policy scanning still covers the whole repository.
      cargo-args: "--workspace --all-targets --exclude qlog-dancer --exclude quiche"
      apt-packages: "libexpat1-dev libfreetype6-dev libfontconfig1-dev"
