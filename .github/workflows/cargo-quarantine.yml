name: Cargo release-age quarantine

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cargo-quarantine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quarantine:
    uses: codeandsolder/ci-workflows/.github/workflows/cargo-release-quarantine.yml@50c4dbb544f008f87ba479324b43a1bd807672bd # main
