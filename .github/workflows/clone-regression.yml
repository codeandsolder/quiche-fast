name: Duplicate-code regression

on:
  pull_request:
  push:
    branches: [master]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  duplicates:
    uses: codeandsolder/ci-workflows/.github/workflows/clone-regression.yml@b99346ff3b2422e966189263a1d5913ddb92ef9d # main
