on:
  push:
    tags: ["*"]
  workflow_dispatch:

name: Nightly

permissions:
  contents: read
  pull-requests: write

env:
  FEATURES: "async,ffi,qlog,rpk"
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "--cfg docsrs"
  RUSTUP_TOOLCHAIN: "nightly"

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quiche_nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

      - name: Install qlog-dancer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libexpat1-dev libfreetype6-dev libfontconfig1-dev

      - name: Run cargo test
        run: cargo test --verbose --all-targets --features=${{ env.FEATURES }}

      - name: Run cargo test with custom-client-dcid feature enabled
        run: cargo test --verbose --all-targets --features=custom-client-dcid,${{ env.FEATURES }}

      # Need to run doc tests separately.
      # (https://github.com/rust-lang/cargo/issues/6669)
      - name: Run cargo doc test
        run: cargo test --verbose --doc --features=${{ env.FEATURES }}

      # NOTE: this is disabled as it fails when building changes that bump
      # version of local crates (e.g. when doing a `qlog` release) that have not
      # been published yet, and we couldn't find a workaround.
      #
      # - name: Run cargo package
      #   run: cargo package --verbose --workspace --exclude=quiche_apps --allow-dirty

      - name: Run cargo doc
        run: cargo doc --no-deps --all-features --document-private-items

      - name: Build C examples
        run: |
          sudo apt-get install libev-dev uthash-dev
          make -C quiche/examples

  fuzz:
    runs-on: ubuntu-latest
    # `quiche-fuzz` calls `RAND_reset_for_fuzzing`, which BoringSSL only
    # exports when built with `FUZZING_BUILD_MODE_UNSAFE_FOR_PRODUCTION`.
    # BoringSSL 5.x consolidated the older
    # `BORINGSSL_UNSAFE_{DETERMINISTIC,FUZZER}_MODE` defines into this
    # single switch. `boring-sys` doesn't expose a feature for it, but
    # cmake-rs (via cc-rs) honors `CFLAGS`/`CXXFLAGS`, so inject the
    # define there.
    env:
      CFLAGS: "-DFUZZING_BUILD_MODE_UNSAFE_FOR_PRODUCTION"
      CXXFLAGS: "-DFUZZING_BUILD_MODE_UNSAFE_FOR_PRODUCTION"
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run cargo fuzz for packet_recv_client
        run: cargo fuzz run packet_recv_client -- -runs=1

      - name: Run cargo fuzz for packet_recv_server
        run: cargo fuzz run packet_recv_server -- -runs=1

      - name: Run cargo fuzz for qpack_decode
        run: cargo fuzz run qpack_decode -- -runs=1

  http3_test_nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

      - name: Run cargo test
        run: cargo test --no-run --verbose --manifest-path=tools/http3_test/Cargo.toml

  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: rustfmt

      - name: Run cargo fmt - quiche
        run: cargo fmt -- --check

      - name: Run cargo fmt - http3_test
        run: cargo fmt --manifest-path=tools/http3_test/Cargo.toml -- --check

      - name: Run cargo fmt - fuzz
        run: cargo fmt --manifest-path=fuzz/Cargo.toml -- --check
