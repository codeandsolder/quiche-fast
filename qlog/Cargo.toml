[package]
name = "qlog"
version = "0.18.1"
description = "qlog data model for QUIC and HTTP/3"
repository = { workspace = true }
authors = ["Lucas Pardue <lucas@lucaspardue.com>"]
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
readme = "README.md"

[lints]
workspace = true

[features]
# CI-only: enable expectations for lints emitted by latest-nightly Clippy
# but not by the pinned stable toolchain. No runtime/API behavior changes.
nightly-clippy-expects = []

# Enable gzip compression / decompression of qlog streams via
# [`flate2`]. Used by [`writer::make_qlog_writer`] and
# [`reader::QlogSeqReader::with_file`].
gzip = ["dep:flate2"]

# Enable zstd compression / decompression of qlog streams via
# [`zstd`]. Pulls in `zstd-sys` (C dependency). Used by
# [`writer::make_qlog_writer`] and
# [`reader::QlogSeqReader::with_file`].
zstd = ["dep:zstd"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
jiff = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
serde_with = { workspace = true, features = ["macros"] }

# Optional: use the fleet zlib-rs backend for gzip.
flate2 = { version = "1", default-features = false, features = ["zlib-rs", "runtime_detection"], optional = true }

# Optional: zstd backend for the `zstd` feature. Depends on
# `zstd-sys` (C).
zstd = { version = "0.14", default-features = false, optional = true }

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3"
