[package]
name = "buffer-pool"
version = "0.2.1"
repository = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
description = "Pooled in-memory buffers"

[lints]
workspace = true

[features]
# CI-only: enable expectations for lints emitted by latest-nightly Clippy
# but not by the pinned stable toolchain. No runtime/API behavior changes.
nightly-clippy-expects = []

[dependencies]
crossbeam = { workspace = true, features = ["alloc"] }
foundations = { workspace = true, default-features = false, features = [
  "metrics",
] }
