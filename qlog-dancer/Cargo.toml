[package]
name = "qlog-dancer"
version = "0.1.0"
description = "qlog and netlog log analysis and visualization"
repository = { workspace = true }
authors = ["Lucas Pardue lucas@lucaspardue.com>"]
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
readme = "README.md"

[lints]
workspace = true

[dependencies]
clap = { workspace = true, features = ["derive"] }
env_logger = { workspace = true }
log = { workspace = true }
netlog = { workspace = true }
plotters = "0.3.4"
qlog = { workspace = true, features = ["gzip", "zstd"] }
serde = { workspace = true }
serde_json = { workspace = true }
tabled = "0.22.0"

wirefilter-engine = { git = "https://github.com/cloudflare/wirefilter.git", rev="a101f7c0fc60012803ee23432b5514644d9fbe4f" }

# By default, getrandom doesn't have any source of randomness on wasm32-unknown.
# This optional dependency allows us to build with `--features getrandom/wasm_js`.
# This also requires that the backend is set via .cargo/config.toml.
# For more information see: https://docs.rs/getrandom/#webassembly-support
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
plotters-canvas = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Document", "Window", "Element"] }

[dev-dependencies]
image = { version = "0.25.0", default-features = false, features = ["png"] }
smallvec = { workspace = true }

[lib]
crate-type = ["lib", "cdylib"]

[package.metadata.cargo-machete]
ignored = ["wirefilter-engine"]
