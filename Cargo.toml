[workspace]
members = [
  "apps",
  "datagram-socket",
  "h3i",
  "netlog",
  "octets",
  "qlog",
  "qlog-dancer",
  "quiche",
  "task-killswitch",
  "tokio-quiche",
]
exclude = ["fuzz", "tools/http3_test"]
resolver = "2"

[workspace.package]
edition = "2021"
repository = "https://github.com/cloudflare/quiche"
license = "BSD-2-Clause"
readme = "README.md"
keywords = ["quic", "http3"]
categories = ["network-programming"]

[workspace.lints.clippy]
mem_forget = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[workspace.lints.rust]
unfulfilled_lint_expectations = "deny"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(capture_keylogs)',
  'cfg(test_invalid_len_compilation_fail)',
] }

[workspace.metadata.release]
pre-release-commit-message = "{{crate_name}}: release {{version}}"
consolidate-commits = false
tag-prefix = "{{crate_name}}-"
tag-name = "{{prefix}}{{version}}"
tag-message = "{{crate_name}} {{version}}"
publish = false

[workspace.dependencies]
anyhow = { version = "1" }
assert_matches = { version = "1" }
btls = { git = "https://github.com/codeandsolder/btls-fast.git", rev = "1f74e9fda91926e5185c2d028d393054b167e84a" }
bytes = { version = "1.11.1" }
clap = { version = "4" }
crossbeam-utils = { version = "0.8", default-features = false }
dashmap = { version = "6" }
datagram-socket = { version = "0.8.1", path = "./datagram-socket" }
env_logger = "0.11.12"
# Shared metrics ABI for tokio-quiche.
foundations = { version = "5", default-features = false }
futures = { version = "0.3" }
futures-util = { version = "0.3", default-features = false }
h3i = { version = "0.7", path = "./h3i" }
ipnetwork = { version = "0.21" }
libc = { version = "0.2.76", default-features = false }
log = { version = "0.4.20" }
mio = { version = "1" }
nix = { version = "0.32.0", features = ["net", "uio", "socket"] }
netlog = { version = "0.1", path="./netlog" }
octets = { version = "0.3.7", path = "./octets" }
pin-project = { version = "1.0.12" }
qlog = { version = "0.18.1", path = "./qlog" }
quiche = { version = "0.30.0", path = "./quiche" }
regex = { version = "1.4.2" }
rstest = { version = "0.28.0" }
serde = { version = "1" }
serde_json = { version = "1" }
serde_with = { version = "3.20.0", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-log = "0.2"
smallvec = { version = "1.10", default-features = false }
task-killswitch = { version = "0.2.1", path = "./task-killswitch" }
thiserror = { version = "2" }
jiff = { version = "1.0.1", default-features = false, features = ["std"] }
tokio = { version = "1.44", default-features = false }
tokio-quiche = { version = "0.20.0", path = "./tokio-quiche" }
tokio-stream = { version = "0.1" }
tokio-util = { version = "0.7.13" }
url = { version = "2.5.9" }

[profile.bench]
debug = true

[profile.release]
debug = true

[patch.crates-io]
zlib-rs = { git = "https://github.com/codeandsolder/zlib-rs-fast.git", rev = "1ec3a5612ee28803a7756fa52bd013389507a2db" }
